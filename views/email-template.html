<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .header { background-color: #0fa44a; padding: 20px; text-align: center; color: white; }
    .header h1 { margin: 0; font-size: 24px; }
    .content { padding: 30px; color: #333333; line-height: 1.6; }
    .footer { background: #eeeeee; padding: 15px; text-align: center; font-size: 12px; color: #777777; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Custom Notification</h1>
    </div>
    <div class="content">
      <p>Hello <strong>{{name}}</strong>,</p>
      <p>{{message}}</p>
    </div>
    <div class="footer">
      <p>This email was automatically generated via your custom SMTP portal.</p>
    </div>
  </div>
</body>
</html>
